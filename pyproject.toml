[project]
name = "neuma"
version = "0.0.1"
description = "Gregorian chant in GABC notation, sung by ElevenLabs voices"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "praat-parselmouth>=0.4.7",
    "pyworld>=0.3.4",
    "setuptools<81",  # pyworld 0.3.5 imports pkg_resources
    "soundfile>=0.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
